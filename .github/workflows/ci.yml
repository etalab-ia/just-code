name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test POSIX installer
        run: sh tests/installers/test-posix.sh

  integration-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Test pinned OpenCode host integration
        run: tests/integration/opencode/run.sh
      - name: Test credential lab server lifecycle
        run: python -m unittest discover -s tests/integration/credentials/lab -p 'test_*.py' -v

  # Linux builds inside Ubuntu 20.04 so the binary remains compatible with the
  # SDK's glibc baseline instead of inheriting the runner host's newer glibc.
  platform-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates gcc git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trust the mounted workspace
        # VCS stamping shells out to git, and the container user does not own the
        # mounted checkout. Writing the exception to the system config makes it
        # visible to every later step regardless of HOME.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native target
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - run: go test ./...
      - run: go build ./cmd/just-code

  # The SDK embeds a platform-specific FFI library and uses CGO, so macOS and
  # Windows are built and tested on native runners. These jobs do not boot a
  # microVM: hosted runners lack nested virtualization.
  platform-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test POSIX installer on macOS
        if: matrix.os == 'darwin'
        run: sh tests/installers/test-posix.sh
      - name: Test PowerShell installer
        if: matrix.os == 'windows'
        shell: powershell
        run: ./tests/installers/test-windows.ps1
      # The runner's gcc is an x86_64 MinGW cross compiler, which cannot
      # assemble arm64. CGO needs a GNU-ABI aarch64 compiler, so the pinned
      # LLVM-MinGW toolchain is installed for the Windows arm64 leg.
      - name: Install the Windows arm64 C toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260616"
          LLVM_MINGW_SHA256: "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:LLVM_MINGW_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "llvm-mingw-$version-ucrt-aarch64\bin")
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=aarch64-w64-mingw32-clang'
          Add-Content -Path $env:GITHUB_ENV -Value 'CXX=aarch64-w64-mingw32-clang++'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native target
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            go env CC | grep -q aarch64-w64-mingw32-clang
          fi
      - run: go test ./...
      - run: go build ./cmd/just-code
