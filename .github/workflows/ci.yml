name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build all platform targets
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            echo "Building $os/$arch..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build ./cmd/just-code
          done

  # Windows runs the test suite natively on real hardware. This exercises the
  # platform-parameterized runtime selection (windows defaults to microsandbox)
  # and the batch-shim attach fix. It does NOT boot a microsandbox VM: GitHub
  # Windows runners do not expose nested virtualization / WHP, so the guest flow
  # remains a manual check on a real poste.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Check formatting
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { Write-Error "gofmt: not formatted: $bad" }
      - run: go vet ./...
      - run: go test ./...
