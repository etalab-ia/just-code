name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload assets for"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.dispatch.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.dispatch.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Manual path: build and upload assets for an already-released tag, so
      # the artifact pipeline can be exercised without cutting a release.
      - name: Resolve manual dispatch tag
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release exists for $TAG. release-please creates releases; this path only attaches assets."
            exit 1
          fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates gcc git
      - uses: actions/checkout@v4
        with:
          # Build the exact release tag, not HEAD of main at job start time.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Trust the mounted workspace
        # VCS stamping shells out to git, and the container user does not own the
        # mounted checkout. Writing the exception to the system config makes it
        # visible to every later step regardless of HOME.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Verify native target
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - run: go test ./...
      - name: Build release binary
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/just-code-${{ matrix.asset }}" ./cmd/just-code
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            asset: darwin-arm64
            ext: ""
          - runner: windows-2025
            os: windows
            arch: amd64
            asset: windows-x64
            ext: .exe
          - runner: windows-11-arm
            os: windows
            arch: arm64
            asset: windows-arm64
            ext: .exe
            # The runner's gcc is an x86_64 MinGW cross compiler, which cannot
            # assemble arm64. CGO needs a GNU-ABI aarch64 compiler, so the
            # pinned LLVM-MinGW toolchain is installed below.
            llvm_mingw: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact release tag, not HEAD of main at job start time.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Install the Windows arm64 C toolchain
        if: matrix.llvm_mingw
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260616"
          LLVM_MINGW_SHA256: "312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:LLVM_MINGW_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "llvm-mingw-$version-ucrt-aarch64\bin")
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=aarch64-w64-mingw32-clang'
          Add-Content -Path $env:GITHUB_ENV -Value 'CXX=aarch64-w64-mingw32-clang++'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Verify native target
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          if [ -n "${{ matrix.llvm_mingw }}" ]; then
            go env CC | grep -q aarch64-w64-mingw32-clang
          fi
      - run: go test ./...
      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/just-code-${{ matrix.asset }}${{ matrix.ext }}" ./cmd/just-code
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build-linux, build-desktop]
    if: needs.release-please.outputs.release_created == 'true' && needs.build-linux.result == 'success' && needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum just-code-* > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/just-code-* dist/SHA256SUMS --clobber
