name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload assets for"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.dispatch.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.dispatch.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Manual path: build and upload assets for an already-released tag, so
      # the artifact pipeline can be exercised without cutting a release.
      - name: Resolve manual dispatch tag
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release exists for $TAG. release-please creates releases; this path only attaches assets."
            exit 1
          fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout release tag
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        uses: actions/checkout@v4
        with:
          # The exact release tag, not whatever HEAD of main is at run time.
          ref: ${{ steps.release.outputs.tag_name || steps.dispatch.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        with:
          go-version: "1.22"
          cache: true

      - name: Check formatting
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Vet and test
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        run: |
          go vet ./...
          go test -race ./...

      - name: Build release binaries
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        env:
          # The release tag is the version source of truth; it is stamped into
          # the binary so `just-code version` reports it.
          VERSION: ${{ steps.release.outputs.tag_name || steps.dispatch.outputs.tag_name }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            case "$os-$arch" in
              darwin-arm64)  name=darwin-arm64 ;;
              darwin-amd64)  name=darwin-x64 ;;
              linux-arm64)   name=linux-arm64 ;;
              linux-amd64)   name=linux-x64 ;;
              windows-amd64) name=windows-x64 ;;
              windows-arm64) name=windows-arm64 ;;
            esac
            echo "Building dist/just-code-$name$ext"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
              -o "dist/just-code-$name$ext" ./cmd/just-code
          done

      - name: Generate checksums
        # From inside dist/ so the entries match the flattened asset names.
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        working-directory: dist
        run: sha256sum just-code-* > SHA256SUMS

      - name: Upload release assets
        if: steps.release.outputs.release_created == 'true' || steps.dispatch.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name || steps.dispatch.outputs.tag_name }}
        run: gh release upload "$TAG" dist/just-code-* dist/SHA256SUMS --clobber
