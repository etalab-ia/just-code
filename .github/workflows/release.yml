name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the embedded VCS metadata is accurate.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build release binaries
        env:
          # The tag is the source of truth for the version; it is stamped into
          # the binary so `just-code version` reports it.
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            case "$os-$arch" in
              darwin-arm64) name=darwin-arm64 ;;
              darwin-amd64) name=darwin-x64 ;;
              linux-arm64)  name=linux-arm64 ;;
              linux-amd64)  name=linux-x64 ;;
            esac
            echo "Building dist/just-code-$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
              -o "dist/just-code-$name" ./cmd/just-code
          done
      - name: Generate checksums
        # From inside dist/ so the entries match the flattened asset names.
        working-directory: dist
        run: sha256sum just-code-* > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/just-code-* dist/SHA256SUMS --clobber
