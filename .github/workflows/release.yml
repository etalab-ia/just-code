name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          version=$(bun -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: bun run check
      - run: shellcheck -s sh src/embedded/tart-bootstrap.sh.txt
      - run: bun run build
      - name: Generate checksums
        working-directory: dist
        run: sha256sum just-code-* > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/just-code-* dist/SHA256SUMS --clobber
