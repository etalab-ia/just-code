# Detects newer upstream Microsandbox runtime releases than the SDK embedded in
# just-code and opens a tracking issue with the digests needed for the reviewed
# update PR. It never publishes anything and never touches the code.
#
# The runtime is downloaded by just-code directly from the upstream immutable
# release (see msbRuntimeReleaseURL in internal/justcode/msb_runtime_install.go).
# No local mirror is kept: the archive is verified against a digest baked in
# the binary before extraction, so hosting the bytes ourselves would not add
# any guarantee, and upstream retains a complete release history (64 releases
# back to May 2025) with no history of removing a release we depend on.
#
# Trust boundary: upstream releases are immutable, so GitHub issues a
# Sigstore-signed release attestation (predicate
# https://in-toto.io/attestation/release/v0.2, signer
# https://dotcom.releases.github.com) covering every release asset. This
# workflow verifies that attestation with `gh release verify` and sources the
# digests reported in the issue from the verified subjects, not from the
# upstream checksums file (which is uploaded alongside the archives and could
# be swapped together with them). Baked digests in
# internal/justcode/msb_runtime_install.go are only updated by a reviewed code
# PR that bumps the SDK version, release URL, and the five digests together.

name: msb-runtime-watch

on:
  schedule:
    # Mondays 09:00 UTC, same cadence as the dependency sweep.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: msb-runtime-watch
  cancel-in-progress: false

env:
  UPSTREAM_REPO: superradcompany/microsandbox
  # Must stay in sync with the platform set of msbRuntimeArtifactFor() in
  # internal/justcode/msb_runtime_install.go.
  EXPECTED_ASSETS: >-
    microsandbox-darwin-aarch64.tar.gz
    microsandbox-linux-aarch64.tar.gz
    microsandbox-linux-x86_64.tar.gz
    microsandbox-windows-aarch64.tar.gz
    microsandbox-windows-x86_64.tar.gz

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Resolve SDK and upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk_version="$(go run ./cmd/just-code -print-msb-sdk-version)"
          upstream="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          upstream_version="${upstream#v}"
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "SDK=$sdk_version upstream=$upstream_version"

      - name: Open or update the tracking issue
        if: steps.versions.outputs.upstream_version != steps.versions.outputs.sdk_version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDK_VERSION: ${{ steps.versions.outputs.sdk_version }}
          UPSTREAM_VERSION: ${{ steps.versions.outputs.upstream_version }}
        run: |
          set -euo pipefail
          title="Mise à jour du runtime Microsandbox : v$UPSTREAM_VERSION disponible"
          # A newer upstream release must update an existing tracking issue,
          # not be silenced by it: match the version-specific title, and edit
          # the issue when the detected version has moved on.
          existing="$(gh issue list --state open --search "Mise à jour du runtime Microsandbox in:title" --json number,title --jq '.[] | select(.title == "Mise à jour du runtime Microsandbox : v'"$UPSTREAM_VERSION"' disponible") | .number')"
          if [ -n "$existing" ]; then
            echo "A tracking issue for v$UPSTREAM_VERSION is already open (#$existing)."
            exit 0
          fi
          # Verify the upstream release attestation cryptographically and
          # source the published digests from its verified subjects. Fails
          # closed when the attestation is absent or invalid.
          gh release verify "v$UPSTREAM_VERSION" --repo "$UPSTREAM_REPO" \
            --format json > attestation.json
          signer="$(jq -r '.verificationResult.signature.certificate.subjectAlternativeName' attestation.json)"
          echo "Attestation verified; signer: $signer"
          digests=""
          for asset in $EXPECTED_ASSETS; do
            digest="$(jq -r --arg a "$asset" '.verificationResult.statement.subject[] | select(.name == $a) | .digest.sha256' attestation.json)"
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error::$asset is not covered by the upstream release attestation"
              exit 1
            fi
            digests="${digests}${digest}  ${asset}"$'\n'
          done
          {
            echo "Une nouvelle release amont du runtime Microsandbox est disponible."
            echo ""
            echo "- Version SDK embarquée : \`v$SDK_VERSION\`"
            echo "- Version amont détectée : \`v$UPSTREAM_VERSION\`"
            echo ""
            echo "Empreintes SHA-256 amont des cinq archives, issues de l'attestation de release GitHub vérifiée cryptographiquement (signataire : \`$signer\`) :"
            echo ""
            echo '```'
            printf '%s' "$digests"
            echo '```'
            echo ""
            echo "Procédure :"
            echo "1. Bump du SDK \`github.com/superradcompany/microsandbox/sdk/go\` vers \`v$UPSTREAM_VERSION\` dans \`go.mod\`."
            echo "2. PR de code mettant à jour ensemble \`msbRuntimeVersion\`, \`msbRuntimeReleaseURL\` et les cinq empreintes dans \`internal/justcode/msb_runtime_install.go\` (\`TestMSBRuntimeVersionMatchesSDK\` bloque un décalage). \`msbRuntimeReleaseURL\` pointe vers la release amont : \`https://github.com/$UPSTREAM_REPO/releases/download/v$UPSTREAM_VERSION\`."
            echo ""
            echo "👾 Generated with [Letta Code](https://letta.com)"
          } > issue-body.md
          gh issue create \
            --title "$title" \
            --label enhancement \
            --body-file issue-body.md
