# Runtime settings for the persistent OpenCode microVM.
# The image, workspace mount, and credentials are supplied by the just-code CLI.
cpus: 2
memory: "4G"
workdir: "/workspace"
shell: "/bin/sh"
entrypoint: ["/bin/sh", "-c"]
cmd: ["exec /.msb/scripts/start"]
network:
  policy: public
  ports:
    - "4096:4096"
    - "3000:3000"
    - "3001:3001"
    - "3002:3002"
    - "3003:3003"
    - "3004:3004"
    - "3005:3005"
    - "3006:3006"
    - "3007:3007"
    - "3008:3008"
    - "3009:3009"
    - "3010:3010"
secrets:
  ALBERT_API_KEY:
    allow: ["albert.api.etalab.gouv.fr"]
env:
  OPENCODE_CONFIG_CONTENT: >-
    {"$schema":"https://opencode.ai/config.json","provider":{"albert":{"npm":"@ai-sdk/openai-compatible","name":"Albert API (État)","options":{"baseURL":"https://albert.api.etalab.gouv.fr/v1","apiKey":"{env:ALBERT_API_KEY}"},"models":{"deepseek-v4-flash":{"name":"DeepSeek V4 Flash (Albert)","limit":{"context":131072,"output":65536}}}}},"model":"albert/deepseek-v4-flash","small_model":"albert/deepseek-v4-flash","permission":{"edit":"allow","external_directory":"allow","bash":{".*":"allow","git push.*(--force|-f | --force-with-lease)":"deny","sudo .*":"deny"},"webfetch":"allow","websearch":"allow","skill":"allow","task":"allow"}}
scripts:
  start: |
    set -eu
    if [ ! -f /var/lib/just-code/toolchain-ready ]; then
      apk add --no-cache bash build-base ca-certificates curl git nodejs npm procps python3 py3-pip
      mkdir -p /var/lib/just-code
      touch /var/lib/just-code/toolchain-ready
    fi
    git config --global user.name "Albert Code Agent"
    git config --global user.email "albert-code@noreply.etalab.gouv.fr"
    git config --global --add safe.directory '*'
    exec opencode serve --hostname 0.0.0.0 --port 4096
